name: Build ImmortalWrt (MTK Proprietary) for CMCC XR30

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if upstream commit is unchanged'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 20 * * 0' # Weekly at 04:00 Beijing time every Monday
  push:
    branches:
      - main
    paths:
      - '.config'
      - 'diy-part2.sh'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  CONFIG_FILE: .config
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  check_upstream:
    name: Check Upstream Changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_sha: ${{ steps.check.outputs.upstream_sha }}
      upstream_short_sha: ${{ steps.check.outputs.upstream_short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check upstream commit
        id: check
        run: |
          UPSTREAM_SHA=$(git ls-remote ${{ env.REPO_URL }}.git refs/heads/${{ env.REPO_BRANCH }} | awk '{print $1}')
          if [ -z "$UPSTREAM_SHA" ]; then
            echo "Error: Failed to fetch upstream SHA from git ls-remote!"
            exit 1
          fi
          SHORT_SHA="${UPSTREAM_SHA:0:7}"
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "upstream_short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

          # 构建条件：强制构建，或该上游 commit 尚无对应 Release（push/schedule 统一走查重，避免重复 3h 构建）
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Force build requested."
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif gh release list --repo "${{ github.repository }}" --json tagName -q ".[].tagName" | grep -q "${SHORT_SHA}"; then
            echo "Release for upstream commit ${SHORT_SHA} already exists. Skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream commit ${SHORT_SHA} detected. Starting build."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Firmware
    needs: check_upstream
    if: needs.check_upstream.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        run: |
          echo "build_date=$(date +'%Y.%m.%d')" >> $GITHUB_OUTPUT
          echo "release_tag=v24.10-${{ needs.check_upstream.outputs.upstream_short_sha }}" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl

      - name: Clone source code
        run: |
          git clone --depth 1 ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 30
          timeout 180 ./scripts/feeds update -a || timeout 180 ./scripts/feeds update -a || true
          ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [ -e files ] && cp -r files openwrt/files
          [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: Download package dependencies
        working-directory: openwrt
        run: |
          make defconfig
          export CURL_OPTIONS="--speed-limit 1000 --speed-time 15 --max-time 180"
          export WGET_OPTIONS="--timeout=15 --tries=2"
          make download -j8 || make download -j2 || true
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: openwrt
        run: |
          echo "Building on $(nproc) threads..."
          make -j$(nproc) || make -j2 V=s

      - name: Prepare release files
        run: |
          mkdir -p release
          cd openwrt/bin/targets/*/*
          rm -rf packages
          cp -v *cmcc*xr30* $GITHUB_WORKSPACE/release/ 2>/dev/null || cp -v *xr30* $GITHUB_WORKSPACE/release/ 2>/dev/null || true
          cd $GITHUB_WORKSPACE/release
          sha256sum * > sha256sums 2>/dev/null || true
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.release_tag }}
          name: "ImmortalWrt 24.10 MTK for CMCC XR30 (${{ steps.vars.outputs.build_date }})"
          body: |
            - **设备**: CMCC XR30 (cmcc_xr30-nand，上游内置设备)
            - **上游**: [padavanonly/immortalwrt-mt798x-6.6](https://github.com/padavanonly/immortalwrt-mt798x-6.6) @ `${{ needs.check_upstream.outputs.upstream_sha }}` (分支 `openwrt-24.10-6.6`，Linux 6.6 + MTK SDK)
            - **本仓库改动**: 仅增量 .config 与两行 sed (默认 IP / Argon 主题)，零设备文件
            - **驱动**: MediaTek mt_wifi 闭源（开源 mt76 方案见 [immortalwrt-xr30](https://github.com/RSxiaoyu/immortalwrt-xr30)）
          files: release/*
